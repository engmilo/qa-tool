<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QA Test Case Generator</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  #api-banner {
    background: #222;
    padding: 15px;
    border: 1px solid #444;
    margin-bottom: 20px;
  }

  .hidden {
    display: none;
  }

  textarea, input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    background: #222;
    border: 1px solid #444;
    color: #eee;
  }

  button {
    padding: 10px 20px;
    background: #4a8ef0;
    border: none;
    color: white;
    cursor: pointer;
    margin-top: 10px;
  }

  #loading-spinner {
    display: none;
    margin: 20px 0;
    text-align: center;
  }

  .test-case-card {
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 15px;
    margin: 15px 0;
  }

  .badge-high { color: #ff6b6b; }
  .badge-medium { color: #f7d774; }
  .badge-low { color: #6bff8a; }

  #stats {
    margin-top: 20px;
    font-size: 1.1em;
  }
</style>
</head>

<body>
<h1>QA Test Case Generator</h1>

<div id="api-banner">
  <p>Enter your Anthropic API key:</p>
  <input id="api-key-input" placeholder="sk-ant-..." />
  <button onclick="saveKey()">Save Key</button>
</div>

<textarea id="feature-input" rows="6"
  placeholder="Example: As a manager, I want to understand my colleagues' progress..."></textarea>

<input id="project-name" placeholder="e.g. Login Feature" />

<button id="generate-btn" onclick="generate()">Generate test cases</button>

<div id="loading-spinner">Generating...</div>

<div id="stats"></div>
<div id="results"></div>

<script>
/* -----------------------------
   Load API Key
----------------------------- */
function loadApiKey() {
  const key = localStorage.getItem("tcg_api_key");
  if (key) {
    document.getElementById("api-key-input").value = key;
    document.getElementById("api-banner").classList.add("hidden");
  }
}

/* -----------------------------
   Save API Key
----------------------------- */
function saveKey() {
  const key = document.getElementById("api-key-input").value.trim();
  if (!key.startsWith("sk-ant-")) {
    alert("Invalid Anthropic API key format.");
    return;
  }
  localStorage.setItem("tcg_api_key", key);
  document.getElementById("api-banner").classList.add("hidden");
}

/* -----------------------------
   Generate Test Cases (Claude)
----------------------------- */
async function generate() {
  const key = localStorage.getItem("tcg_api_key");
  if (!key) {
    alert("Please enter your Anthropic API key first.");
    return;
  }

  const input = document.getElementById("feature-input").value.trim();
  if (!input) {
    alert("Please enter a feature description.");
    return;
  }

  const spinner = document.getElementById("loading-spinner");
  spinner.style.display = "block";

  try {
    const response = await fetch("https://qa-proxy.eng-milo.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-allow-browser": "true"
      },
      body: JSON.stringify({
        model: "claude-3-sonnet-20240229",
        max_tokens: 1000,
        temperature: 0.2,
        system: `You are an expert QA engineer.
Return ONLY valid JSON. No markdown. No backticks.
Format:
{
  "testCases": [
    {
      "title": "string",
      "steps": ["string"],
      "expected": "string",
      "priority": "High" | "Medium" | "Low"
    }
  ]
}`,
        messages: [
          {
            role: "user",
            content: `Generate test cases for this feature:\n\n${input}`
          }
        ]
      })
    });

    const data = await response.json();
    console.log("Claude raw:", data);

    const raw =
      data.completion ||
      (Array.isArray(data.content) && data.content[0]?.text) ||
      "";

    const cleaned = raw
      .replace(/```json/gi, "")
      .replace(/```/g, "")
      .trim();

    console.log("Cleaned JSON:", cleaned);

    const parsed = JSON.parse(cleaned);

    renderCards(parsed.testCases);
    updateStats(parsed.testCases);

  } catch (err) {
    console.error("Generation error:", err);
    alert("Failed to generate test cases. Check console for details.");
  } finally {
    spinner.style.display = "none";
  }
}

/* -----------------------------
   Render Cards
----------------------------- */
function renderCards(testCases) {
  const container = document.getElementById("results");
  container.innerHTML = "";

  testCases.forEach(tc => {
    const card = document.createElement("div");
    card.className = "test-case-card";

    card.innerHTML = `
      <h3>${tc.title}</h3>
      <div class="badge-${tc.priority.toLowerCase()}">${tc.priority}</div>

      <h4>Steps</h4>
      <ul>
        ${tc.steps.map(s => `<li>${s}</li>`).join("")}
      </ul>

      <h4>Expected</h4>
      <p>${tc.expected}</p>
    `;

    container.appendChild(card);
  });
}

/* -----------------------------
   Update Stats
----------------------------- */
function updateStats(testCases) {
  const total = testCases.length;
  const high = testCases.filter(t => t.priority === "High").length;
  const medium = testCases.filter(t => t.priority === "Medium").length;
  const low = testCases.filter(t => t.priority === "Low").length;

  document.getElementById("stats").innerHTML = `
    <strong>Total:</strong> ${total} |
    <strong>High:</strong> ${high} |
    <strong>Medium:</strong> ${medium} |
    <strong>Low:</strong> ${low}
  `;
}

window.onload = loadApiKey;
</script>
</body>
</html>
