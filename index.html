<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Test Case Generator</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1117; --surface: #1a1d27;
      --border: rgba(255,255,255,0.08); --border-hover: rgba(255,255,255,0.15);
      --text: #e8eaf0; --text-muted: #8b8fa8; --text-dim: #555870;
      --cyan: #22d3ee; --green: #34d399; --amber: #fbbf24; --red: #f87171; --purple: #a78bfa;
      --radius: 10px; --font: 'Segoe UI', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 960px; margin: 0 auto; }
    header { }
    .logo { font-size: 0.75rem; font-family: var(--mono); color: var(--cyan); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.5rem; }
    h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .subtitle { font-size: 0.95rem; color: var(--text-muted); }
    .tabs { display: flex; gap: 4px; margin-bottom: 1.5rem; background: var(--surface); border-radius: var(--radius); padding: 4px; width: fit-content; }
    .tab { padding: 8px 20px; border-radius: 7px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-muted); transition: all 0.2s; }
    .tab.active { background: var(--cyan); color: #0a0e1a; }
    .project-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .project-bar label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
    .project-bar input[type="text"] { flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 0.9rem; padding: 9px 14px; }
    .project-bar input[type="text"]:focus { outline: none; border-color: var(--cyan); }
    .save-btn { padding: 9px 18px; background: var(--purple); color: #fff; font-weight: 700; font-size: 0.85rem; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
    .save-btn:hover { opacity: 0.85; }
    .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.25rem; }
    .input-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; display: block; }
    textarea { width: 100%; min-height: 110px; resize: vertical; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 0.95rem; padding: 12px 14px; line-height: 1.6; transition: border-color 0.2s; }
    textarea:focus { outline: none; border-color: var(--cyan); }
    textarea::placeholder { color: var(--text-dim); }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
    button#generate-btn { padding: 10px 24px; background: var(--cyan); color: #0a0e1a; font-weight: 700; font-size: 0.9rem; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
    button#generate-btn:hover { opacity: 0.9; }
    button#generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    select { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 0.85rem; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; font-family: var(--mono); color: var(--cyan); }
    .tc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 12px; transition: border-color 0.2s; }
    .tc-card:hover { border-color: var(--border-hover); }
    .tc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .tc-id { font-size: 0.7rem; font-family: var(--mono); color: var(--text-dim); margin-bottom: 4px; }
    .tc-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .badge { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; white-space: nowrap; }
    .badge-high { background: rgba(248,113,113,0.15); color: var(--red); }
    .badge-medium { background: rgba(251,191,36,0.12); color: var(--amber); }
    .badge-low { background: rgba(52,211,153,0.12); color: var(--green); }
    .tc-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .section-label { font-size: 0.7rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .steps-list { list-style: none; padding: 0; }
    .steps-list li { font-size: 0.875rem; color: var(--text-muted); padding: 4px 0 4px 28px; position: relative; line-height: 1.5; }
    .steps-list li::before { content: attr(data-n); position: absolute; left: 0; top: 5px; font-size: 0.7rem; font-family: var(--mono); color: var(--text-dim); background: rgba(255,255,255,0.05); border-radius: 3px; padding: 1px 5px; }
    .expected { font-size: 0.875rem; color: var(--text-muted); line-height: 1.6; border-left: 2px solid var(--green); padding-left: 12px; }
    .loading { display: flex; align-items: center; gap: 14px; padding: 2rem 0; color: var(--text-muted); font-size: 0.9rem; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--cyan); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text-dim); font-size: 0.9rem; border: 1px dashed var(--border); border-radius: var(--radius); }
    .error { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); border-radius: var(--radius); padding: 1rem 1.25rem; color: var(--red); font-size: 0.875rem; margin-bottom: 1rem; }
    .copy-all-btn { font-size: 0.8rem; padding: 7px 16px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); cursor: pointer; margin-top: 4px; transition: all 0.2s; }
    .copy-all-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 14px; }
    .project-name { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .project-date { font-size: 0.75rem; color: var(--text-dim); font-family: var(--mono); margin-bottom: 12px; }
    .project-meta { display: flex; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
    .project-meta span { font-size: 0.8rem; color: var(--text-muted); }
    .coverage-bar-wrap { margin-bottom: 12px; }
    .coverage-bar-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
    .coverage-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .coverage-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--cyan), var(--green)); }
    .project-actions { display: flex; gap: 8px; }
    .btn-sm { font-size: 0.78rem; padding: 6px 14px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .btn-sm:hover { border-color: var(--cyan); color: var(--cyan); }
    .btn-sm.danger:hover { border-color: var(--red); color: var(--red); }
    .cov-section { margin-bottom: 2rem; }
    .cov-section h2 { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 1rem; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .cov-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .bar-list { display: flex; flex-direction: column; gap: 12px; }
    .bar-item { display: flex; align-items: center; gap: 12px; }
    .bar-name { font-size: 0.8rem; color: var(--text-muted); width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
    .bar-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; }
    .bar-count { font-size: 0.75rem; font-family: var(--mono); color: var(--text-dim); width: 28px; text-align: right; }
    .examples-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; display: block; }
    .examples-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.25rem; }
    .example-chip { font-size: 0.78rem; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .example-chip:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,0.1); }

    body.light {
      --bg: #f4f6fb; --surface: #ffffff;
      --border: rgba(0,0,0,0.08); --border-hover: rgba(0,0,0,0.18);
      --text: #1a1d27; --text-muted: #555870; --text-dim: #9ca3b0;
      --cyan: #0891b2; --green: #059669; --amber: #d97706; --red: #dc2626; --purple: #7c3aed;
    }
    body.light .steps-list li::before { background: rgba(0,0,0,0.06); }
    body.light textarea { background: rgba(0,0,0,0.03); }
    body.light .example-chip { background: #f8fafc; }
    footer { margin-top: 3rem; text-align: center; font-size: 0.75rem; color: var(--text-dim); font-family: var(--mono); }
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .controls { flex-direction: column; align-items: stretch; }
      .cov-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
      <div>
        <div class="logo">// QA Tools</div>
        <h1 id="app-title">AI Test Case Generator</h1>
        <p class="subtitle" id="app-subtitle">Generate, save, and track test cases by project.</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <select id="lang-select" onchange="setLang(this.value)" style="font-size:0.8rem;padding:6px 10px;">
          <option value="en">🇬🇧 English</option>
          <option value="fi">🇫🇮 Suomi</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="es">🇪🇸 Español</option>
          <option value="ar">🇸🇦 العربية</option>
        </select>
        <button onclick="toggleTheme()" id="theme-btn" style="padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:0.85rem;transition:all 0.2s;">🌙 Dark</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="showTab('generate')">Generate</button>
      <button class="tab" onclick="showTab('projects')">Projects</button>
      <button class="tab" onclick="showTab('coverage')">Coverage</button>
    </div>

    <!-- GENERATE TAB -->
    <div id="tab-generate">
      <div class="project-bar">
        <label>Project</label>
        <input type="text" id="project-name" placeholder="e.g. Login Feature, Sprint 12..." />
        <button class="save-btn" id="save-btn" onclick="saveToProject()" disabled>Save to project</button>
      </div>
      <label class="examples-label">Try an example</label>
      <div class="examples-grid">
        <button class="example-chip" onclick="useExample(this)">Login & Authentication</button>
        <button class="example-chip" onclick="useExample(this)">Shopping Cart & Checkout</button>
        <button class="example-chip" onclick="useExample(this)">Email Notifications</button>
        <button class="example-chip" onclick="useExample(this)">Role-Based Access</button>
        <button class="example-chip" onclick="useExample(this)">Password Reset</button>
        <button class="example-chip" onclick="useExample(this)">Manager Progress Report</button>
      </div>
      <div class="input-card">
        <label class="input-label">Feature Description or User Story</label>
        <textarea id="feature-input" placeholder="Example: As a manager, I want to understand my colleagues' progress so I can better report our success and failures.&#10;&#10;Or: User can log in with email and password. If credentials are wrong, an error message is shown. After 3 failed attempts, the account is locked for 15 minutes."></textarea>
      </div>
      <div class="controls">
        <button id="generate-btn" onclick="generate()">Generate test cases</button>
        <select id="filter" onchange="renderCards()">
          <option value="all">All priorities</option>
          <option value="High">High only</option>
          <option value="Medium">Medium only</option>
          <option value="Low">Low only</option>
        </select>
      </div>
      <div id="stats" style="display:none" class="stats">
        <div class="stat"><div class="stat-label">Total cases</div><div class="stat-value" id="s-total">0</div></div>
        <div class="stat"><div class="stat-label">High priority</div><div class="stat-value" style="color:var(--red)" id="s-high">0</div></div>
        <div class="stat"><div class="stat-label">Medium priority</div><div class="stat-value" style="color:var(--amber)" id="s-medium">0</div></div>
        <div class="stat"><div class="stat-label">Steps covered</div><div class="stat-value" style="color:var(--green)" id="s-steps">0</div></div>
      </div>
      <div id="output"><div class="empty">Your generated test cases will appear here</div></div>
    </div>

    <!-- PROJECTS TAB -->
    <div id="tab-projects" style="display:none">
      <div id="projects-list"></div>
    </div>

    <!-- COVERAGE TAB -->
    <div id="tab-coverage" style="display:none">
      <div id="coverage-content"></div>
    </div>

    <footer>Built with Claude AI &mdash; for QA professionals</footer>
  </div>

  <script>
    let allCases = [];

    const examples = {
      'Login & Authentication': 'User can log in with email and password. Email must be valid format. Password is case sensitive. Show error message for wrong credentials. Lock account after 3 failed attempts for 15 minutes. A remember me option keeps the user logged in for 30 days.',
      'Shopping Cart & Checkout': 'As a customer, I want to add items to my cart and complete checkout using a credit card. I should be able to update quantities, remove items, apply discount codes, and receive an order confirmation email after successful payment.',
      'Search & Filters': 'Users can search for products by name, category, or price range. Results should be sorted by relevance by default. Users can filter by rating, availability, and brand. Search should return results within 2 seconds.',
      'File Upload': 'Users can upload a profile picture in JPG or PNG format up to 5MB. Files that exceed the size limit or have invalid formats should show a clear error message. Uploaded images should be resized to 200x200 pixels automatically.',
      'Email Notifications': 'As a user I want to receive email notifications when my order status changes so I can track my delivery. Notifications should be sent for: order confirmed, order shipped, out for delivery, and delivered. Users can unsubscribe from notifications in their settings.',
      'Role-Based Access': 'As an admin I can create, edit and delete user accounts. Managers can view all team reports but cannot edit user accounts. Regular users can only view and edit their own profile. Unauthenticated users are redirected to the login page.',
      'Password Reset': 'User can reset their password by entering their email address. They receive a reset link valid for 24 hours. The new password must be at least 8 characters with one number and one special character. After reset, all other sessions are invalidated.',
      'Manager Progress Report': 'As a manager, I want to be able to understand my colleagues progress so I can better report our success and failures. I should be able to view progress by team member, filter by date range, and export reports to PDF or Excel.'
    };

    function useExample(btn) {
      const key = btn.textContent.trim();
      const text = examples[key];
      if (text) {
        document.getElementById('feature-input').value = text;
        document.getElementById('feature-input').focus();
      }
    }
    let projects = JSON.parse(localStorage.getItem('qa_projects') || '[]');

    function showTab(name) {
      ['generate','projects','coverage'].forEach(t => {
        document.getElementById('tab-'+t).style.display = t === name ? 'block' : 'none';
      });
      document.querySelectorAll('.tab').forEach((btn, i) => {
        btn.classList.toggle('active', ['generate','projects','coverage'][i] === name);
      });
      if (name === 'projects') renderProjects();
      if (name === 'coverage') renderCoverage();
    }

    async function generate() {
      const input = document.getElementById('feature-input').value.trim();
      if (!input) { alert('Please describe a feature or user story.'); return; }
      const btn = document.getElementById('generate-btn');
      btn.disabled = true; btn.textContent = 'Generating...';
      document.getElementById('stats').style.display = 'none';
      document.getElementById('output').innerHTML = '<div class="loading"><div class="spinner"></div>AI is writing your test cases...</div>';
      document.getElementById('save-btn').disabled = true;
      try {
        const res = await fetch('https://qa-proxy.eng-milo.workers.dev/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514', max_tokens: 2000,
            system: `You are an expert QA engineer. Given a feature description or user story, generate comprehensive test cases.
Return ONLY valid JSON with no markdown, no backticks, no explanation:
{"testCases":[{"id":"TC-001","title":"Short title","priority":"High|Medium|Low","steps":["Step 1","Step 2"],"expectedResult":"What should happen"}]}
Generate 6-10 test cases covering happy paths, edge cases, and negative scenarios.`,
            messages: [{ role: 'user', content: `Feature/Story: ${input}` }]
          })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        const text = data.content?.find(b => b.type === 'text')?.text || '';
        const parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
        allCases = parsed.testCases || [];
        renderCards(); updateStats();
        document.getElementById('save-btn').disabled = false;
      } catch(e) {
        document.getElementById('output').innerHTML = `<div class="error"><strong>Error:</strong> ${e.message}</div>`;
      }
      btn.disabled = false; btn.textContent = 'Generate test cases';
    }

    function updateStats() {
      document.getElementById('s-total').textContent = allCases.length;
      document.getElementById('s-high').textContent = allCases.filter(t => t.priority === 'High').length;
      document.getElementById('s-medium').textContent = allCases.filter(t => t.priority === 'Medium').length;
      document.getElementById('s-steps').textContent = allCases.reduce((s, t) => s + (t.steps?.length || 0), 0);
      document.getElementById('stats').style.display = 'grid';
    }

    function renderCards() {
      if (!allCases.length) return;
      const filter = document.getElementById('filter').value;
      const cases = filter === 'all' ? allCases : allCases.filter(t => t.priority === filter);
      if (!cases.length) { document.getElementById('output').innerHTML = '<div class="empty">No test cases match this filter.</div>'; return; }
      document.getElementById('output').innerHTML = cases.map(tc => `
        <div class="tc-card">
          <div class="tc-top">
            <div><div class="tc-id">${tc.id}</div><div class="tc-title">${tc.title}</div></div>
            <span class="badge badge-${(tc.priority||'').toLowerCase()}">${tc.priority}</span>
          </div>
          <hr class="tc-divider">
          <div class="section-label">Steps</div>
          <ol class="steps-list">${(tc.steps||[]).map((s,i)=>`<li data-n="${i+1}">${s}</li>`).join('')}</ol>
          <hr class="tc-divider">
          <div class="section-label">Expected result</div>
          <div class="expected">${tc.expectedResult}</div>
        </div>
      `).join('') + `<button class="copy-all-btn" onclick="copyAll()">Copy all as text</button>`;
    }

    function saveToProject() {
      const name = document.getElementById('project-name').value.trim() || 'Untitled Project';
      const story = document.getElementById('feature-input').value.trim();
      const idx = projects.findIndex(p => p.name === name);
      const project = {
        name, story, testCases: [...allCases],
        savedAt: new Date().toISOString(),
        high: allCases.filter(t => t.priority === 'High').length,
        medium: allCases.filter(t => t.priority === 'Medium').length,
        low: allCases.filter(t => t.priority === 'Low').length,
        steps: allCases.reduce((s, t) => s + (t.steps?.length || 0), 0)
      };
      if (idx >= 0) projects[idx] = project; else projects.unshift(project);
      localStorage.setItem('qa_projects', JSON.stringify(projects));
      const btn = document.getElementById('save-btn');
      btn.textContent = 'Saved!';
      setTimeout(() => btn.textContent = 'Save to project', 2000);
    }

    function renderProjects() {
      const el = document.getElementById('projects-list');
      if (!projects.length) { el.innerHTML = '<div class="empty">No projects saved yet. Generate test cases and save them to a project!</div>'; return; }
      el.innerHTML = projects.map((p, i) => {
        const total = p.testCases.length;
        const highPct = total ? Math.round((p.high/total)*100) : 0;
        const date = new Date(p.savedAt).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
        return `<div class="project-card">
          <div class="project-name">${p.name}</div>
          <div class="project-date">Saved ${date}</div>
          <div class="project-meta">
            <span><strong style="color:var(--cyan)">${total}</strong> test cases</span>
            <span><strong style="color:var(--red)">${p.high}</strong> high</span>
            <span><strong style="color:var(--amber)">${p.medium}</strong> medium</span>
            <span><strong style="color:var(--green)">${p.low}</strong> low</span>
            <span><strong style="color:var(--cyan)">${p.steps}</strong> steps</span>
          </div>
          <div class="coverage-bar-wrap">
            <div class="coverage-bar-label"><span>High priority ratio</span><span style="color:var(--green);font-weight:700">${highPct}%</span></div>
            <div class="coverage-bar"><div class="coverage-bar-fill" style="width:${highPct}%"></div></div>
          </div>
          <div class="project-actions">
            <button class="btn-sm" onclick="loadProject(${i})">Load test cases</button>
            <button class="btn-sm danger" onclick="deleteProject(${i})">Delete</button>
          </div>
        </div>`;
      }).join('');
    }

    function loadProject(i) {
      const p = projects[i];
      allCases = p.testCases;
      document.getElementById('feature-input').value = p.story;
      document.getElementById('project-name').value = p.name;
      showTab('generate');
      renderCards(); updateStats();
      document.getElementById('save-btn').disabled = false;
    }

    function deleteProject(i) {
      if (!confirm('Delete this project?')) return;
      projects.splice(i, 1);
      localStorage.setItem('qa_projects', JSON.stringify(projects));
      renderProjects(); renderCoverage();
    }

    function renderCoverage() {
      const el = document.getElementById('coverage-content');
      if (!projects.length) { el.innerHTML = '<div class="empty">No data yet. Save some projects first to see coverage tracking!</div>'; return; }
      const total = projects.reduce((s, p) => s + p.testCases.length, 0);
      const high = projects.reduce((s, p) => s + p.high, 0);
      const medium = projects.reduce((s, p) => s + p.medium, 0);
      const low = projects.reduce((s, p) => s + p.low, 0);
      const steps = projects.reduce((s, p) => s + p.steps, 0);
      const avg = projects.length ? Math.round(total / projects.length) : 0;
      const maxCases = Math.max(...projects.map(p => p.testCases.length), 1);
      el.innerHTML = `
        <div class="cov-section">
          <h2>Overall summary</h2>
          <div class="cov-grid">
            <div class="stat"><div class="stat-label">Projects</div><div class="stat-value">${projects.length}</div></div>
            <div class="stat"><div class="stat-label">Total test cases</div><div class="stat-value">${total}</div></div>
            <div class="stat"><div class="stat-label">Total steps</div><div class="stat-value" style="color:var(--green)">${steps}</div></div>
            <div class="stat"><div class="stat-label">Avg per project</div><div class="stat-value">${avg}</div></div>
            <div class="stat"><div class="stat-label">High priority</div><div class="stat-value" style="color:var(--red)">${high}</div></div>
            <div class="stat"><div class="stat-label">Medium priority</div><div class="stat-value" style="color:var(--amber)">${medium}</div></div>
          </div>
        </div>
        <div class="cov-section">
          <h2>Test cases per project</h2>
          <div class="bar-list">
            ${projects.map(p => `
              <div class="bar-item">
                <span class="bar-name">${p.name}</span>
                <div class="bar-track"><div class="bar-fill" style="width:${Math.round((p.testCases.length/maxCases)*100)}%;background:var(--cyan)"></div></div>
                <span class="bar-count">${p.testCases.length}</span>
              </div>`).join('')}
          </div>
        </div>
        <div class="cov-section">
          <h2>Priority breakdown by project</h2>
          <div class="bar-list">
            ${projects.map(p => {
              const t = p.testCases.length || 1;
              return `<div style="margin-bottom:16px">
                <div style="font-size:0.8rem;font-weight:600;color:var(--text-muted);margin-bottom:8px">${p.name}</div>
                <div class="bar-item" style="margin-bottom:5px">
                  <span class="bar-name" style="font-size:0.72rem;color:var(--red)">High</span>
                  <div class="bar-track"><div class="bar-fill" style="width:${Math.round((p.high/t)*100)}%;background:var(--red)"></div></div>
                  <span class="bar-count">${p.high}</span>
                </div>
                <div class="bar-item" style="margin-bottom:5px">
                  <span class="bar-name" style="font-size:0.72rem;color:var(--amber)">Medium</span>
                  <div class="bar-track"><div class="bar-fill" style="width:${Math.round((p.medium/t)*100)}%;background:var(--amber)"></div></div>
                  <span class="bar-count">${p.medium}</span>
                </div>
                <div class="bar-item">
                  <span class="bar-name" style="font-size:0.72rem;color:var(--green)">Low</span>
                  <div class="bar-track"><div class="bar-fill" style="width:${Math.round((p.low/t)*100)}%;background:var(--green)"></div></div>
                  <span class="bar-count">${p.low}</span>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    function copyAll() {
      const text = allCases.map(tc =>
        `${tc.id} — ${tc.title} [${tc.priority}]\nSteps:\n${(tc.steps||[]).map((s,i)=>`  ${i+1}. ${s}`).join('\n')}\nExpected: ${tc.expectedResult}`
      ).join('\n\n---\n\n');
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-all-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy all as text', 2000);
      });
    }

    let currentLang = localStorage.getItem('qa_lang') || 'en';
    let isLight = localStorage.getItem('qa_theme') === 'light';

    function t(key) { return (i18n[currentLang] || i18n.en)[key] || i18n.en[key] || key; }

    function applyLang() {
      const isRtl = currentLang === 'ar';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
      document.getElementById('app-title').textContent = t('title');
      document.getElementById('app-subtitle').textContent = t('subtitle');
      document.querySelector('.tab.active') && applyTabLabels();
      applyTabLabels();
      document.querySelector('.project-bar label').textContent = t('projectLabel');
      document.getElementById('project-name').placeholder = t('projectPlaceholder');
      document.getElementById('save-btn').textContent = t('saveBtn');
      document.querySelector('.examples-label').textContent = t('examplesLabel');
      document.querySelector('.input-label').textContent = t('featureLabel');
      document.getElementById('feature-input').placeholder = t('featurePlaceholder');
      document.getElementById('generate-btn').textContent = t('generateBtn');
      const opts = document.getElementById('filter').options;
      opts[0].text = t('filterAll'); opts[1].text = t('filterHigh'); opts[2].text = t('filterMedium'); opts[3].text = t('filterLow');
      const statLabels = document.querySelectorAll('.stat-label');
      if (statLabels[0]) { statLabels[0].textContent = t('statTotal'); statLabels[1].textContent = t('statHigh'); statLabels[2].textContent = t('statMedium'); statLabels[3].textContent = t('statSteps'); }
      document.querySelector('footer').textContent = t('footer');
      const outEl = document.getElementById('output');
      if (outEl.querySelector('.empty')) outEl.innerHTML = '<div class="empty">' + t('outputEmpty') + '</div>';
    }

    function applyTabLabels() {
      const tabs = document.querySelectorAll('.tab');
      if (tabs[0]) { tabs[0].textContent = t('tabGenerate'); tabs[1].textContent = t('tabProjects'); tabs[2].textContent = t('tabCoverage'); }
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('qa_lang', lang);
      applyLang();
    }

    function toggleTheme() {
      isLight = !isLight;
      localStorage.setItem('qa_theme', isLight ? 'light' : 'dark');
      applyTheme();
    }

    function applyTheme() {
      document.body.classList.toggle('light', isLight);
      document.getElementById('theme-btn').textContent = isLight ? t('themeDark') : t('themeLight');
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      applyLang();
      document.getElementById('lang-select').value = currentLang;
    });
